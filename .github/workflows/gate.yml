name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "26" }
      - uses: dtolnay/rust-toolchain@stable
      - name: The gate (same one every lane runs)
        run: ./test.sh
