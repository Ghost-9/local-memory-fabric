[package]
name = "memory-fabric-engine"
version = "1.7.0"
edition = "2024"

[[bin]]
name = "memory-fabric"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.36", features = ["bundled-full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
uuid = { version = "1", features = ["v4"] }
